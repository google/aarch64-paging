[package]
name = "aarch64-paging"
version = "0.12.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A library to manipulate AArch64 VMSA page tables."
authors = [
  "Ard Biesheuvel <ardb@google.com>",
  "Andrew Walbran <qwandor@google.com>",
]
repository = "https://github.com/google/aarch64-paging"
keywords = ["arm", "aarch64", "cortex-a", "vmsa", "pagetable"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
bitflags = "2.13.0"
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
bolero = "0.13"

[features]
default = ["alloc"]
alloc = []

# Used by `cargo bolero test`, which builds the tests with this profile for coverage-guided fuzzing.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-unknown-none"
rustdoc-args = ["--cfg", "docsrs"]
